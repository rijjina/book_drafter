version: 2

project:
  title: "ชื่อหนังสือ"
  subject: "สาขาวิชา"
  author: "ชื่อผู้เขียน"
  keywords:
    - "คำสำคัญ 1"
    - "คำสำคัญ 2"
  language: "th-TH"
  header_text: "ชื่อหนังสือ"
  footer_page_numbers: true

style:
  # Optional DOCX whose styles, numbering, headers, and footers are reused.
  template:
  font: "TH Sarabun New"
  body_size_pt: 16
  title_size_pt: 22
  heading_sizes_pt: [18, 16, 16]
  caption_size_pt: 14
  line_spacing: 1.15
  first_line_indent_cm: 1.25
  colors:
    text: "000000"
    heading: "17365D"
    muted: "666666"
  page:
    size: "A4"
    orientation: "portrait"
    margin_top_cm: 3.0
    margin_bottom_cm: 2.5
    margin_left_cm: 3.0
    margin_right_cm: 2.5
    header_distance_cm: 1.25
    footer_distance_cm: 1.25
  table:
    cell_margin_dxa: 120
    header_fill: "D9EAF7"

build:
  directory: ".docx-build"
  state: ".docx-build/state.json"
  manuscript_output: "final/manuscript.docx"

chapters:
  - id: "chapter-01"
    # The first existing Markdown file is authoritative for this build.
    source_candidates:
      - "chapters/chapter-01/revised.md"
      - "chapters/chapter-01/draft.md"
    metadata:
      title: "บทที่ 1 ชื่อบท"
    assets:
      images:
        - id: "conceptual-framework"
          path: "figures/chapter-01-conceptual-framework.png"
          alt: "กรอบแนวคิดของบทที่ 1"
          caption: "ภาพที่ 1.1 กรอบแนวคิดของบทที่ 1"
          width_cm: 14.0
      tables:
        - id: "comparison"
          path: "tables/chapter-01-comparison.csv"
          caption: "ตารางที่ 1.1 การเปรียบเทียบประเด็นสำคัญ"
          widths: [2, 5, 3]

  - id: "chapter-02"
    source_candidates:
      - "chapters/chapter-02/revised.md"
      - "chapters/chapter-02/draft.md"

# Insert manifest assets into Markdown with exact marker lines:
# {{figure:conceptual-framework}}
# {{table:comparison}}
# Use {{pagebreak}} only when a deliberate page break is required.
# Build only after final QC approval and explicit `Deliverable: DOCX`:
# python scripts/build_docx.py --manifest document.yml --final-only
